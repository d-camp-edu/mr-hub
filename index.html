    <style>
        /* ═══════════ Layer 1: PRIMITIVE (원시값) ═══════════ */
        :root {
            --slate-50:#F8FAFC;  --slate-100:#F1F5F9; --slate-200:#E2E8F0;
            --slate-300:#CBD5E1; --slate-400:#94A3B8; --slate-500:#64748B;
            --slate-600:#475569; --slate-700:#334155; --slate-800:#1E293B; --slate-900:#0F172A;
            --blue-50:#EFF6FF;   --blue-600:#2563EB;  --blue-700:#1D4ED8;
            --red-50:#FEF2F2;    --red-600:#DC2626;   --red-700:#B91C1C;
            --green-50:#F0FDF4;  --green-600:#16A34A;
            --amber-50:#FFFBEB;  --amber-600:#D97706;

            --space-1:4px;  --space-2:8px;  --space-3:12px;
            --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px;

            --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
        }

        /* ═══════════ Layer 2: SEMANTIC (역할) ═══════════ */
        :root {
            --color-bg:            var(--slate-50);
            --color-surface:       #FFFFFF;
            --color-surface-2:     var(--slate-50);
            --color-fg:            var(--slate-800);   /* 본문 */
            --color-fg-muted:      var(--slate-600);   /* 보조 — 흰 배경 대비 7.5:1 */
            --color-fg-subtle:     var(--slate-500);   /* 최소 보조 — 4.8:1, 이보다 옅게 쓰지 말 것 */
            --color-border:        var(--slate-200);
            --color-deep:          var(--slate-900);   /* 로그인·사업부 선택 화면 배경 */

            /* 포인트 컬러 — 3단계에서 관리자가 바꾸면 이 4개만 교체됨 */
            --color-primary:       var(--blue-600);
            --color-primary-hover: var(--blue-700);
            --color-primary-soft:  var(--blue-50);
            --color-on-primary:    #FFFFFF;

            --color-danger:        var(--red-600);     /* 삭제 전용. 다른 용도 금지 */
            --color-danger-soft:   var(--red-50);
            --color-success:       var(--green-600);
            --color-success-soft:  var(--green-50);
            --color-warning:       var(--amber-600);
            --color-warning-soft:  var(--amber-50);

            --elev-card:  0 1px 2px rgba(15,23,42,.06);
            --elev-modal: 0 12px 32px rgba(15,23,42,.18);
            --focus-ring: 3px;
            --touch-min:  44px;
        }

        /* ═══════════ Layer 3: COMPONENT ═══════════ */
        :root {
            --card-radius: var(--radius-lg);
            --card-pad:    var(--space-4);
            --btn-h:       48px;
            --input-h:     52px;
            --chip-h:      44px;
        }

        body {
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            color: var(--color-fg);
            background: var(--color-bg);
        }

        /* 포커스 링 — 기존 outline-none 27곳을 덮어씀 (키보드 사용 시에만 노출) */
        :focus-visible {
            outline: var(--focus-ring) solid var(--color-primary) !important;
            outline-offset: 2px !important;
            border-radius: var(--radius-sm);
        }

        /* 터치 타깃 최소 44px — .tap 을 붙인 요소에 적용 */
        .tap { min-height: var(--touch-min); min-width: var(--touch-min); }
        .tap-icon {
            min-height: var(--touch-min); min-width: var(--touch-min);
            display: inline-flex; align-items: center; justify-content: center;
        }

        /* 12px 미만 텍스트 방지용 유틸 (기존 text-[9~11px] 대체) */
        .text-caption { font-size: 12px; line-height: 1.4; }

        /* 화면에는 안 보이지만 스크린리더는 읽는 라벨 */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }

        /* 스켈레톤 */
        [aria-busy="true"] .bg-surface-2 { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--slate-300); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: var(--slate-400); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        /* iOS 입력 자동확대 방지 — user-scalable=no 대신 이걸로 해결 (수동 확대는 가능) */
        input, select, textarea { font-size: 16px !important; }

        /* 토스트 */
        .toast-enter { animation: toastIn .22s cubic-bezier(.16,1,.3,1); }
        .toast-exit  { animation: toastOut .15s ease forwards; }
        @keyframes toastIn  { from { opacity:0; transform: translateY(12px) } to { opacity:1; transform:none } }
        @keyframes toastOut { to { opacity:0; transform: translateY(8px) } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* ═══════════ 부팅 스플래시 ═══════════ */
        /* 브랜드 설정(로고·제목·포인트 컬러)이 도착하기 전까지 기본 화면 대신 이 화면을 보여준다.
           <body>의 조립 스크립트와 React <BootSplash/>가 같은 클래스를 쓰므로,
           React가 마운트되는 순간에도 그림이 바뀌지 않는다. */
        .boot-splash {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: var(--color-deep);
            padding: var(--space-6);
        }
        .boot-card {
            display: flex; flex-direction: column; align-items: center; gap: var(--space-6);
        }
        .boot-logo {
            width: 64px; height: 64px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-md);
            background: var(--color-primary-soft); color: var(--color-primary);
        }
        /* 저장된 로고가 있으면 소프트 박스 없이 이미지만 (로그인 카드와 동일한 모양) */
        .boot-logo.has-img { width: auto; height: auto; background: none; border-radius: 0; }
        .boot-logo-img { max-height: 56px; width: auto; object-fit: contain; }
        .boot-title { font-size: 24px; line-height: 1.3; font-weight: 700; color: #FFFFFF; }
        .boot-spinner {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,.22);
            border-top-color: var(--color-primary);
            animation: boot-spin .7s linear infinite;
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }

        /* 스플래시 → 본 화면 전환 */
        .boot-fade { animation: boot-fade-in .18s ease-out both; }
        @keyframes boot-fade-in { from { opacity: 0 } to { opacity: 1 } }

        /* 설정을 못 받고 있을 때만 나오는 안내 (기본 화면으로 멋대로 넘기지 않는다) */
        .boot-stall { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
        .boot-stall-msg {
            font-size: 14px; line-height: 1.6; text-align: center;
            color: rgba(255,255,255,.72);
        }
        .boot-stall-btn {
            min-height: 44px; padding: 0 var(--space-6);
            border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,.28);
            background: transparent; color: #FFFFFF;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: background-color .15s ease;
        }
        .boot-stall-btn:hover { background: rgba(255,255,255,.12); }

        @media (prefers-reduced-motion: reduce) {
            /* 위 전역 규칙이 스피너 회전까지 멈추므로, 대신 글자로 상태를 알린다 */
            .boot-spinner { display: none; }
            .boot-status {
                position: static; width: auto; height: auto;
                margin: 0; clip: auto; overflow: visible;
                font-size: 14px; color: rgba(255,255,255,.7);
            }
        }
    </style>

    <!-- 저장해 둔 포인트 컬러를 첫 페인트 전에 확정한다.
         (로고·제목은 #root가 필요해서 <body>의 스플래시 조립 스크립트가 이어 받는다) -->
    <script>
        (function () {
            try {
                var cache = JSON.parse(localStorage.getItem('mr_brand_cache') || 'null');
                if (!cache) return;
                window.__BRAND_CACHE__ = cache;

                var t = cache.theme;
                if (!t) return;
                // deriveTheme() 결과를 그대로 저장해 두었으므로 CSS 변수에 다시 꽂기만 하면 된다.
                var vars = {
                    primary: '--color-primary', hover: '--color-primary-hover', soft: '--color-primary-soft',
                    onPrimary: '--color-on-primary', bg: '--color-bg', surface2: '--color-surface-2',
                    border: '--color-border', fg: '--color-fg', fgMuted: '--color-fg-muted',
                    fgSubtle: '--color-fg-subtle', deep: '--color-deep'
                };
                var r = document.documentElement.style;
                for (var k in vars) { if (t[k]) r.setProperty(vars[k], t[k]); }
            } catch (e) { /* 캐시가 깨졌으면 조용히 기본값으로 */ }
        })();
    </script>
</head>
<body class="bg-surface-2">
    <!-- Babel이 JSX를 컴파일하는 동안 빈 화면이 보이지 않도록 스플래시를 미리 그려둔다.
         마크업을 정적으로 두면 "기본 로고 → 저장된 로고" 교체가 눈에 띄므로,
         아래 스크립트가 완성된 스플래시를 한 번에 넣는다(중간 상태 없음).
         createRoot().render()가 이걸 <BootSplash/>로 교체하는데 같은 모양이라 깜빡임이 없다. -->
    <div id="root"></div>
    <script>
        (function () {
            try {
                var cache = window.__BRAND_CACHE__ || null;   // <head>에서 읽어 둔 지난 방문의 설정
                var b = (cache && cache.brand) || {};
                if (cache && cache.theme && cache.theme.bg) document.body.style.background = cache.theme.bg;

                var logoBox = document.createElement('div');
                if (b.companyLogo) {
                    logoBox.className = 'boot-logo has-img';
                    var img = document.createElement('img');
                    img.className = 'boot-logo-img';
                    img.src = b.companyLogo;
                    img.alt = b.companyName || '';
                    logoBox.appendChild(img);
                } else {
                    logoBox.className = 'boot-logo';
                    logoBox.innerHTML =
                        '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
                        ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                        '<rect x="4" y="2" width="16" height="20" rx="2" ry="2" />' +
                        '<line x1="9" y1="22" x2="9" y2="2" /><line x1="15" y1="22" x2="15" y2="2" />' +
                        '<line x1="4" y1="6" x2="20" y2="6" /><line x1="4" y1="10" x2="20" y2="10" />' +
                        '<line x1="4" y1="14" x2="20" y2="14" /><line x1="4" y1="18" x2="20" y2="18" />' +
                        '</svg>';
                }

                var title = document.createElement('h1');
                title.className = 'boot-title';
                title.textContent = b.appTitle || 'MR HUB';

                var spinner = document.createElement('div');
                spinner.className = 'boot-spinner';
                spinner.setAttribute('aria-hidden', 'true');

                var status = document.createElement('span');
                status.className = 'sr-only boot-status';
                status.setAttribute('role', 'status');
                status.textContent = '불러오는 중…';

                var card = document.createElement('div');
                card.className = 'boot-card';
                card.appendChild(logoBox);
                card.appendChild(title);
                card.appendChild(spinner);
                card.appendChild(status);

                var splash = document.createElement('div');
                splash.className = 'boot-splash';
                splash.appendChild(card);

                // 다 조립한 뒤 한 번에 붙인다 — 반쯤 그려진 스플래시가 보일 틈이 없다.
                document.getElementById('root').appendChild(splash);
            } catch (e) { /* 실패해도 곧 React가 같은 스플래시를 그린다 */ }
        })();
    </script>

        // 범용 이미지 압축 헬퍼 함수
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // 해상도 유지 및 용량 최적화
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // ═══════════ 로고 전용 압축 ═══════════
        // compressImage는 JPEG로 고정되어 있어 PNG 투명 배경이 검게 뭉갠다.
        // 로고는 알파 채널을 반드시 보존해야 하므로 PNG로 내보낸다.
        const LOGO_MAX_BYTES = 200 * 1024;
        const compressLogo = (file, onDone, onError) => {
            const reader = new FileReader();
            reader.onerror = () => onError && onError("파일을 읽지 못했습니다.");
            reader.onload = (event) => {
                const img = new Image();
                img.onerror = () => onError && onError("이미지 형식을 인식하지 못했습니다.");
                img.onload = () => {
                    const MAX = 400;
                    let w = img.width, h = img.height;
                    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
                    if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    // 배경을 칠하지 않음 → 투명 영역 그대로 유지
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const out = canvas.toDataURL('image/png');
                    // base64는 원본 대비 약 4/3 크기
                    const bytes = Math.round(out.length * 3 / 4);
                    if (bytes > LOGO_MAX_BYTES) {
                        onError && onError(`로고 용량이 ${Math.round(bytes/1024)}KB로 너무 큽니다. 200KB 이하 이미지를 사용해주세요.`);
                        return;
                    }
                    onDone(out, bytes);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // ═══════════ 포인트 컬러 파생 ═══════════
        // 관리자가 어떤 색을 넣어도 버튼 글씨가 읽히도록 대비를 계산해 결정한다.
        const hexToRgb = (hex) => {
            const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((hex || "").trim());
            return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : null;
        };
        const rgbToHsl = ({r,g,b}) => {
            r/=255; g/=255; b/=255;
            const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
            let h=0; const l=(max+min)/2;
            const s = d===0 ? 0 : d/(1-Math.abs(2*l-1));
            if (d!==0) {
                if (max===r) h=((g-b)/d)%6;
                else if (max===g) h=(b-r)/d+2;
                else h=(r-g)/d+4;
                h*=60; if (h<0) h+=360;
            }
            return { h, s, l };
        };
        const hslToHex = ({h,s,l}) => {
            s=Math.min(1,Math.max(0,s)); l=Math.min(1,Math.max(0,l));
            const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
            let [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
            const to = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
            return `#${to(r)}${to(g)}${to(b)}`;
        };
        const relLuminance = ({r,g,b}) => {
            const f = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
            return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
        };
        const contrastRatio = (hexA, hexB) => {
            const a = hexToRgb(hexA), b = hexToRgb(hexB);
            if (!a || !b) return 0;
            const la = relLuminance(a), lb = relLuminance(b);
            return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
        };
        const DEFAULT_POINT = "#2563EB";
        // 포인트 컬러 하나에서 배경·표면·테두리·글자색까지 한 세트로 파생한다.
        // 배경은 같은 색이 아니라 같은 '계열'로만 아주 옅게 물들인다(채도를 크게 낮춤).
        const deriveTheme = (hex) => {
            const rgb = hexToRgb(hex);
            if (!rgb) return deriveTheme(DEFAULT_POINT);
            const hsl = rgbToHsl(rgb);
            const h = hsl.h;
            const s = hsl.s;

            const primary = hslToHex(hsl);
            const hover   = hslToHex({ ...hsl, l: Math.max(0.08, hsl.l - 0.08) });
            const soft    = hslToHex({ h, s: s * 0.35, l: 0.95 });

            // ── 세트 컬러: 같은 색조, 아주 낮은 채도 ──
            const bg       = hslToHex({ h, s: Math.min(s * 0.22, 0.16), l: 0.975 });
            const surface2 = hslToHex({ h, s: Math.min(s * 0.28, 0.20), l: 0.958 });
            const border   = hslToHex({ h, s: Math.min(s * 0.20, 0.14), l: 0.902 });
            // 본문 글자도 완전 중성 회색 대신 살짝 같은 계열로 (대비는 유지)
            const fg       = hslToHex({ h, s: Math.min(s * 0.30, 0.22), l: 0.17 });
            const fgMuted  = hslToHex({ h, s: Math.min(s * 0.22, 0.16), l: 0.36 });
            const fgSubtle = hslToHex({ h, s: Math.min(s * 0.18, 0.14), l: 0.48 });
            // 로그인/사업부 선택 화면의 짙은 배경
            const deep     = hslToHex({ h, s: Math.min(s * 0.55, 0.45), l: 0.12 });

            // 흰 글씨와 짙은 글씨 중 대비가 높은 쪽을 자동 선택
            const onWhite = contrastRatio(primary, "#FFFFFF");
            const onDark  = contrastRatio(primary, "#0F172A");
            const onPrimary = onWhite >= onDark ? "#FFFFFF" : "#0F172A";

            return {
                primary, hover, soft, onPrimary,
                bg, surface2, border, fg, fgMuted, fgSubtle, deep,
                contrast: Math.max(onWhite, onDark),
                bodyContrast: contrastRatio(fg, bg)
            };
        };

                setMyProfile(prev => {
                    const next = { ...prev, ...patch };
                    if (empId) {
                        try { localStorage.setItem(profileKey(empId), JSON.stringify(next)); } catch (e) {}
                    }
                    return next;
                });
            }, [empId]);

            // 폼에 내 정보를 흘려넣는다 (사용자가 이미 입력한 값은 건드리지 않음)
            const withProfile = useCallback((form) => ({
                ...form,
                division: form.division || myProfile.division,
                team:     form.team     || myProfile.team,
                name:     form.name     || myProfile.name,
                ...(('phone' in form) ? { phone: form.phone || myProfile.phone } : {})
            }), [myProfile]);

            // 내 정보가 준비되면 아직 비어 있는 폼 칸을 채운다
            useEffect(() => {
                if (!myProfile.division && !myProfile.team && !myProfile.name && !myProfile.phone) return;
                setPhotoForm(f => withProfile(f));
                setForm301Info(f => withProfile(f));
                setSympForm(f => withProfile(f));
                setInquiryForm(f => withProfile(f));
                setRequestForm(f => ({
                    ...f,
                    requesterName: f.requesterName || myProfile.name,
                    phone: f.phone || myProfile.phone
                }));
            }, [myProfile, withProfile]);

            // 자료실 정렬/로딩 상태
            const [sortBy, setSortBy] = useState("recent");   // recent | name | popular
            const [dataLoading, setDataLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);
            const [viewCounts, setViewCounts] = useState({});  // 기존 logs 컬렉션에서 집계

            // ===== 사업부별 데이터 공간 =====
            // 주의: DM팀은 기존 데이터가 전부 여기 있으므로 이 값을 절대 바꾸지 말 것.
            const DEFAULT_APP_ID = "dm-team-mr-hub-v3";
            const [activeAppId, setActiveAppId] = useState(() => {
                const saved = sessionStorage.getItem('mr_app_id');
                // 이전 세션에 저장된 잘못된 값 교정 (아래 LEGACY_APPID와 동일 규칙)
                if (saved === "onco-mr-hub-v1") return "onco-team-mr-hub-v3";
                return saved || DEFAULT_APP_ID;
            });
            // 선택된 사업부 id. 없으면 사업부 선택 화면부터 시작.
            const [divisionId, setDivisionId] = useState(sessionStorage.getItem('mr_div_id') || "");

            // ===== 브랜드 설정 (전역: 사업부 선택 전 화면에서 쓰이므로 사업부와 무관) =====
            const DEFAULT_BRAND = {
                companyLogo: "",
                companyName: "종근당",
                appTitle: "MR HUB",
                divisionPrompt: "소속 사업부를 선택하세요",
                loginPrompt: "MR 전용 보안 인증",
                pointColor: DEFAULT_POINT,
                adminPassword: "0000",   // 최초 1회용. 설정 화면에서 바꾸면 Firestore에만 저장됨
                divisions: [
                    { id: "dm",   label: "DM팀",     sublabel: "당뇨사업부", logo: "", dataAppId: DEFAULT_APP_ID },
                    // 항암사업부는 이미 운영 중인 공간(자료 11건·분류 10종). 이 값을 바꾸면 기존 자료가 보이지 않는다.
                    { id: "onco", label: "항암사업부", sublabel: "",          logo: "", dataAppId: "onco-team-mr-hub-v3" }
                ]
            };
            // 지난 방문에 저장한 설정을 곧바로 초기값으로 쓴다 → 재방문 시 기본 화면이 아예 안 보인다.
            const [brand, setBrand] = useState(() => {
                const cached = readBrandCache();
                const b = cached && cached.brand;
                if (!b) return DEFAULT_BRAND;
                return {
                    ...DEFAULT_BRAND, ...b,
                    divisions: Array.isArray(b.divisions) && b.divisions.length
                        ? b.divisions
                        : DEFAULT_BRAND.divisions
                };
            });

            // 화면 게이트: 브랜드 설정이 확정되기 전에는 스플래시만 보여준다.
            // 캐시가 있으면 이미 "내가 설정한 화면"이므로 곧바로 연다.
            const [brandReady, setBrandReady] = useState(() => !!readBrandCache());
            // 파이어스토어 문서를 실제로 받았는가 (기본값을 캐시에 굳히지 않기 위해 구분한다)
            const [brandLoaded, setBrandLoaded] = useState(false);
            // 설정을 못 받고 있을 때만 스플래시에 안내와 수동 진행 버튼을 띄운다
            const [bootStalled, setBootStalled] = useState(false);

            const brandRef = useCallback(
                () => window.FB.doc(window.FB.db, 'artifacts', window.FB.ROOT_ID, 'public', 'data', 'settings', 'brand'),
                []
            );

            // 브랜드 설정 화면 상태
            const [brandAuthOpen, setBrandAuthOpen]   = useState(false);
            const [brandAuthInput, setBrandAuthInput] = useState("");
            const [brandEditorOpen, setBrandEditorOpen] = useState(false);
            const [brandDraft, setBrandDraft] = useState(null);
            const [brandSaving, setBrandSaving] = useState(false);

            // 잘못 저장된 데이터 공간 값 교정.
            // onco-mr-hub-v1은 실제로 쓰인 적 없는 빈 공간이고(전체 0건),
            // 항암사업부의 실 데이터는 onco-team-mr-hub-v3에 있다(자료 11건·분류 10종).
            const LEGACY_APPID = { "onco-mr-hub-v1": "onco-team-mr-hub-v3" };
            const normalizeDivisions = useCallback((list) =>
                (list || []).map(d => LEGACY_APPID[d.dataAppId]
                    ? { ...d, dataAppId: LEGACY_APPID[d.dataAppId] }
                    : d
                ), []);

            // 브랜드 문서 구독 — activeAppId와 독립
            useEffect(() => {
                if (!user || !window.FB) return;
                return window.FB.onSnapshot(brandRef(), (snap) => {
                    // 응답이 온 시점에 화면을 연다 — 문서가 없어도 "확인됨"이므로 기본값으로 진행.
                    setBrandReady(true);
                    if (!snap.exists()) return;   // 없으면 기본값 유지 (덮어쓰지 않음)
                    setBrandLoaded(true);
                    const d = snap.data() || {};
                    setBrand(prev => ({
                        ...prev,
                        ...d,
                        divisions: Array.isArray(d.divisions) && d.divisions.length
                            ? normalizeDivisions(d.divisions)
                            : prev.divisions
                    }));
                }, (e) => {
                    console.error("브랜드 설정 구독 오류:", e);
                    setBootStalled(true);   // 화면을 멋대로 열지 않고 사용자에게 선택권을 준다
                });
            }, [user, brandRef, normalizeDivisions]);

            // 여기서 자동으로 화면을 열면 기본 브랜드가 잠깐 보였다가 바뀐다 — 없애려던 바로 그 깜빡임.
            // 그래서 시간이 지나도 화면을 열지 않고, 스플래시에 안내와 수동 진행 버튼만 띄운다.
            useEffect(() => {
                if (brandReady) return;
                const t = setTimeout(() => setBootStalled(true), 6000);
                return () => clearTimeout(t);
            }, [brandReady]);

            // 포인트 컬러를 CSS 변수에 반영 (토큰을 쓰는 모든 화면에 즉시 전파).
            // useEffect는 페인트 뒤에 돌아서 색이 한 프레임 틀리게 보인다 → useLayoutEffect.
            const theme = useMemo(() => deriveTheme(brand.pointColor), [brand.pointColor]);
            useLayoutEffect(() => {
                const r = document.documentElement.style;
                r.setProperty('--color-primary',       theme.primary);
                r.setProperty('--color-primary-hover', theme.hover);
                r.setProperty('--color-primary-soft',  theme.soft);
                r.setProperty('--color-on-primary',    theme.onPrimary);
                // 세트 컬러 — 배경/표면/테두리/글자까지 같은 계열로
                r.setProperty('--color-bg',        theme.bg);
                r.setProperty('--color-surface-2', theme.surface2);
                r.setProperty('--color-border',    theme.border);
                r.setProperty('--color-fg',        theme.fg);
                r.setProperty('--color-fg-muted',  theme.fgMuted);
                r.setProperty('--color-fg-subtle', theme.fgSubtle);
                r.setProperty('--color-deep',      theme.deep);
                document.body.style.background = theme.bg;
                // 다음 방문의 첫 페인트를 위해 저장 — 부트 스크립트가 이 값을 그대로 다시 꽂는다.
                // 실제로 불러온 설정만 저장한다(기본값을 굳히면 다음 방문에 또 화면이 바뀐다).
                if (brandLoaded) writeBrandCache(brand, theme);
            }, [theme, brand, brandLoaded]);

            // 모든 Firestore 경로는 이 두 헬퍼만 거친다 (경로 오타로 데이터가 안 보이는 사고 방지)
            const colRef = useCallback(
                (name) => window.FB.collection(window.FB.db, 'artifacts', activeAppId, 'public', 'data', name),
                [activeAppId]
            );
            const docRef = useCallback(
                (name, id) => window.FB.doc(window.FB.db, 'artifacts', activeAppId, 'public', 'data', name, id),
                [activeAppId]
            );

            // ===== 토스트 / 확인 모달 (alert·confirm 대체) =====
            const [toasts, setToasts] = useState([]);
            const [confirmState, setConfirmState] = useState(null);

            const toast = useCallback((message, kind = "info") => {
                const id = Date.now() + Math.random();
                setToasts(list => [...list, { id, message, kind }]);
                setTimeout(() => setToasts(list => list.filter(t => t.id !== id)), 4000);
            }, []);

            // confirm()과 동일한 자리에서 쓰되 await 필요: if (!(await askConfirm(...))) return;
            const askConfirm = useCallback((message, opts = {}) => new Promise(resolve => {
                setConfirmState({
                    message,
                    confirmLabel: opts.confirmLabel || "삭제",
                    danger: opts.danger !== false,
                    resolve
                });
            }), []);

            const closeConfirm = useCallback((result) => {
                setConfirmState(s => { s && s.resolve(result); return null; });
            }, []);

            // Firebase 준비를 폴링으로 기다리면 최대 500ms를 그냥 버린다. 준비 이벤트로 바로 받는다.
            useEffect(() => {
                const start = () => {
                    const { auth, signInAnonymously, onAuthStateChanged } = window.FB;
                    signInAnonymously(auth).then(() => {
                        onAuthStateChanged(auth, setUser);
                    }).catch(err => {
                        console.error("Login Error:", err);
                        setBootStalled(true);   // 인증이 막히면 계속 기다려도 소용없으니 즉시 안내
                    });
                };
                if (window.FB) { start(); return; }
                window.addEventListener('fb-ready', start, { once: true });
                return () => window.removeEventListener('fb-ready', start);
            }, []);

            // 2. 실시간 데이터 불러오기
            useEffect(() => {
                if (!user || !window.FB || !activeAppId) return;
                setDataLoading(true); setLoadError(false);
                const { onSnapshot } = window.FB;

                const unsubSettings = onSnapshot(docRef('settings', 'config'), (docSnap) => {
                    if (docSnap.exists()) {
                        setMrPassword(docSnap.data().mrPassword || "1111");
                        setNewMrPassword(docSnap.data().mrPassword || "1111");
                    } else {
                        setMrPassword("1111");
                        setNewMrPassword("1111");
                    }
                });

                // 공용 목록만 여기서 구독한다. 신청 내역은 아래 별도 effect에서 역할별로 구독
                // (관리자 전환 때 공용 목록까지 전부 다시 읽지 않도록 isAdminMode에 의존하지 않음)
                const listeners = [
                    { col: 'messages', setter: setMessages, sortField: 'timestamp' },
                    { col: 'symposium_list', setter: setSymposiumList, sortField: 'timestamp' },
                    { col: 'categories', setter: setCategoriesList, sortField: 'order' },
                    { col: 'videoCategories', setter: setVideoCategoriesList, sortField: 'order' }
                ].map(item =>
                    onSnapshot(colRef(item.col), (snap) => {
                        let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (item.sortField === 'order') {
                            data.sort((a,b) => (a.order || 0) - (b.order || 0));
                        } else {
                            data.sort((a, b) => b.timestamp - a.timestamp);
                        }
                        item.setter(data);
                        if (item.col === 'messages') { setDataLoading(false); setLoadError(false); }
                    }, (err) => {
                        console.error(`${item.col} 구독 오류:`, err);
                        if (item.col === 'messages') { setDataLoading(false); setLoadError(true); }
                    })
                );

                return () => { unsubSettings(); listeners.forEach(unsub => unsub()); };
            }, [user, activeAppId, colRef, docRef]);

            // 신청 내역: 관리자는 전체, MR은 본인 사번 것만 읽는다 (읽기 사용량 절감)
            useEffect(() => {
                if (!user || !window.FB || !activeAppId) return;
                const { onSnapshot, query, where } = window.FB;
                const setters = [setRequests, setRequests301, setSympRequests, setInquiries, setBrochurePhotos];
                if (!isAdminMode && !empId) { setters.forEach(set => set([])); return; }

                const cols = [
                    { col: 'requests', setter: setRequests },
                    { col: 'requests_301', setter: setRequests301 },
                    { col: 'symposium_requests', setter: setSympRequests },
                    { col: 'inquiries', setter: setInquiries },
                    ...(isAdminMode ? [{ col: 'brochure_photos', setter: setBrochurePhotos }] : [])
                ];
                const unsubs = cols.map(item => {
                    const ref = isAdminMode ? colRef(item.col) : query(colRef(item.col), where('empId', '==', empId));
                    return onSnapshot(ref, (snap) => {
                        item.setter(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp));
                    }, (err) => console.error(`${item.col} 구독 오류:`, err));
                });
                return () => unsubs.forEach(unsub => unsub());
            }, [user, isAdminMode, empId, activeAppId, colRef]);

            // 관리자 탭 로그 불러오기
            const fetchRecentLogs = useCallback(async () => {
                if (!user || !window.FB || !isAdminMode) return;
                try {
                    const { getDocs, query, orderBy, limit } = window.FB;
                    // 전체 로그 대신 최근 50건만 읽는다
                    const snap = await getDocs(query(colRef('logs'), orderBy('timestamp', 'desc'), limit(50)));
                    setRecentLogs(snap.docs.map(d => ({id: d.id, ...d.data()})));
                } catch(e) { console.error("로그 불러오기 오류:", e); }
            }, [user, isAdminMode, colRef]);

            // 로그인 / 로그아웃 처리
            const handleUserLogin = (e) => {
                e.preventDefault();
                if (!/^\d{6}$/.test(loginEmpId.trim())) return toast("사번 6자리를 숫자로 입력하세요.", "error");
                if (loginPassword.trim() !== mrPassword.trim()) return toast("접속 암호가 일치하지 않습니다.", "error");
                sessionStorage.setItem('mr_emp_id', loginEmpId.trim());
                setEmpId(loginEmpId.trim());
                setIsLoggedIn(true);
                logAction("접속", "시스템 로그인");
            };

            const handleLogout = () => {
                sessionStorage.removeItem('mr_emp_id');
                setEmpId(""); setLoginEmpId(""); setLoginPassword("");
                setIsLoggedIn(false); setIsAdminMode(false);
                setActiveTab("home");
                setEditingSympId(null);
            };

            const logAction = async (actionType, targetTitle) => {
                if (!user || !window.FB) return;
                try {
                    await window.FB.addDoc(colRef('logs'), {
                        empId: sessionStorage.getItem('mr_emp_id') || empId, action: actionType, target: targetTitle,
                        timestamp: Date.now(), dateString: new Date().toLocaleString('ko-KR')
                    });
                    // 조회순 정렬용 집계 문서. 매번 전체 로그를 읽지 않도록 열람 시 1씩 올린다
                    if (targetTitle && VIEW_ACTION.test(actionType)) {
                        await window.FB.setDoc(docRef('stats', 'viewCounts'), { counts: { [targetTitle]: window.FB.increment(1) } }, { merge: true });
                    }
                } catch (e) { console.error(e); }
            };

            // DB 데이터 조작 함수
            const toggleStatus = async (collectionName, itemId, currentStatus) => {
                if (!user || !window.FB) return;
                await window.FB.updateDoc(docRef(collectionName, itemId), { completed: !currentStatus });
            };

            const deleteItem = async (collectionName, itemId) => {
                if (!user || !window.FB) return;
                if (!(await askConfirm("정말 삭제하시겠습니까? 되돌릴 수 없습니다."))) return;
                await window.FB.deleteDoc(docRef(collectionName, itemId));
            };

            const moveCategory = async (list, dbPath, index, direction) => {
                if (!window.FB) return;
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= list.length) return;
                const newList = [...list];
                const temp = newList[index];
                newList[index] = newList[newIndex];
                newList[newIndex] = temp;
                
                if (dbPath.includes('video')) setVideoCategoriesList(newList);
                else setCategoriesList(newList);

                const { updateDoc } = window.FB;
                try {
                    await Promise.all(newList.map((item, i) => updateDoc(docRef(dbPath, item.id), { order: i })));
                } catch(e) { console.error("순서 업데이트 실패:", e); }
            };

            const handleUpdateCategory = async (dbPath, item, newName) => {
                if (!window.FB || !newName.trim()) return;
                const finalName = newName.trim();
                if (item.name === finalName) return setEditingCategoryId(null);
                
                const { updateDoc } = window.FB;
                try {
                    await updateDoc(docRef(dbPath, item.id), { name: finalName });
                    const msgsToUpdate = messages.filter(m => m.category === item.name);
                    if (msgsToUpdate.length > 0) {
                        const updatePromises = msgsToUpdate.map(m => updateDoc(docRef('messages', m.id), { category: finalName }));
                        await Promise.all(updatePromises);
                    }
                    toast("카테고리명이 수정되었습니다.", "success");
                } catch (error) { console.error(error); }
                setEditingCategoryId(null);
            };

            // 통합 엑셀 다운로드 (다중 시트 지원, 최신순 정렬)
            const handleDownloadExcel = async () => {
                if (!window.XLSX) return toast("엑셀 모듈 로딩 중입니다. 잠시 후 시도해주세요.", "error");
                try {
                    const wb = window.XLSX.utils.book_new();
                    const sortDesc = (arr) => [...arr].sort((a,b) => b.timestamp - a.timestamp); // 항상 최신순이 맨 위로

                    const logSnap = await window.FB.getDocs(colRef('logs'));
                    const allLogs = logSnap.docs.map(d => d.data());

                    const logData = sortDesc(allLogs).map(l => ({ 사번: l.empId, 활동: l.action, 대상: l.target, 일시: l.dateString }));
                    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(logData), "전체활동로그");

                    const reqData = sortDesc(requests).map(r => ({ 사번: r.empId, 성함: r.requesterName, 연락처: r.phone, 사무소: r.office, 거래처명: r.accountName, 거래처코드: r.accountCode, 품목: r.brochureName, 수량: r.quantity, 상태: r.completed ? "배송완료" : "준비중", 일시: r.dateString }));
                    window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(reqData), "브로슈어신청");

                                                             className="w-full object-cover bg-surface-2"
                                                             style={{ aspectRatio: '16 / 9' }} />
                                                    )}

                                                    <div className="p-5">
                                                        <div className="flex items-center gap-2 mb-2 flex-wrap">
                                                            <span className="text-caption font-bold px-2 py-1 rounded-sm bg-primary-soft text-primary">
                                                                {item.category}
                                                            </span>
                                                            {isNew(item.timestamp) && (
                                                                <span className="text-caption font-bold px-2 py-1 rounded-sm bg-success-soft text-success">NEW</span>
                                                            )}
                                                            <span className="text-caption text-fg-muted">{formatDate(item.timestamp)}</span>
                                                            {sortBy === 'popular' && viewCounts[item.title] > 0 && (
                                                                <span className="text-caption text-fg-muted">· 열람 {viewCounts[item.title]}회</span>
                                                            )}
                                                        </div>

                                                        <h3 className="text-title font-bold text-fg mb-2 text-left">{item.title}</h3>
                                                        {item.description && (
                                                            <p className="text-label text-fg-muted mb-4 line-clamp-2 text-left leading-relaxed">{item.description}</p>
                                                        )}

                                                        <div className="flex gap-2 flex-wrap">
                                                            {item.pdfUrl && (
                                                                <a href={item.pdfUrl} target="_blank" rel="noreferrer"
                                                                   onClick={() => logAction("PDF 열람", item.title)}
                                                                   className="tap flex-1 min-w-[120px] inline-flex items-center justify-center gap-2 rounded-md bg-surface-2 text-fg font-bold text-label border border-line hover:bg-primary-soft hover:text-primary hover:border-primary transition-colors relative overflow-hidden">
                                                                    <span className="absolute left-0 top-0 bottom-0 w-1 bg-danger" aria-hidden="true" />
                                                                    <Icon name="file" size={16} aria-hidden="true" /> PDF 열기
                                                                </a>
                                                            )}
                                                            {item.pptUrl && (
                                                                <a href={item.pptUrl} target="_blank" rel="noreferrer"
                                                                   onClick={() => logAction("PPT 열람", item.title)}
                                                                   className="tap flex-1 min-w-[120px] inline-flex items-center justify-center gap-2 rounded-md bg-surface-2 text-fg font-bold text-label border border-line hover:bg-primary-soft hover:text-primary hover:border-primary transition-colors relative overflow-hidden">
                                                                    <span className="absolute left-0 top-0 bottom-0 w-1 bg-warning" aria-hidden="true" />
                                                                    <Icon name="presentation" size={16} aria-hidden="true" /> PPT 열기
                                                                </a>
                                                            )}
                                                            {item.youtubeUrl && (
                                                                <a href={item.youtubeUrl} target="_blank" rel="noreferrer"
                                                                   onClick={() => logAction("영상 시청", item.title)}
                                                                   className="tap w-full inline-flex items-center justify-center gap-2 rounded-md bg-primary text-on-primary font-bold text-label hover:bg-primary-hover transition-colors">
                                                                    <Icon name="youtube" size={16} aria-hidden="true" /> 영상 시청
                                                                </a>
                                                            )}
                                                        </div>
                                                    </div>
                                                </article>
                                            ))}
                                        </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* ===== 토스트 (포커스를 뺏지 않음) ===== */}
                    <div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[80] w-full max-w-sm px-4 flex flex-col gap-2 pointer-events-none"
                         role="status" aria-live="polite" aria-atomic="false">
                        {toasts.map(t => (
                            <div key={t.id}
                                 className={`toast-enter pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-md shadow-modal text-label font-medium ${
                                     t.kind === 'error'   ? 'bg-danger text-white'   :
                                     t.kind === 'success' ? 'bg-success text-white'  :
                                                            'bg-slate-800 text-white'}`}>
                                <Icon name={t.kind === 'error' ? 'close' : t.kind === 'success' ? 'checkCircle' : 'helpCircle'}
                                      size={18} className="shrink-0 mt-0.5" aria-hidden="true" />
                                <span className="flex-1 text-left leading-relaxed">{t.message}</span>
                            </div>
                        ))}
                    </div>

                    {/* ===== 확인 모달 (window.confirm 대체) ===== */}
                    {confirmState && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
                             role="dialog" aria-modal="true" aria-labelledby="confirm-msg"
                             onClick={e => { if (e.target === e.currentTarget) closeConfirm(false); }}>
                            <div className="bg-surface w-full max-w-sm rounded-lg p-6 shadow-modal">
                                <div className={`w-12 h-12 rounded-md flex items-center justify-center mb-4 ${confirmState.danger ? 'bg-danger-soft text-danger' : 'bg-primary-soft text-primary'}`}>
                                    <Icon name={confirmState.danger ? 'trash' : 'helpCircle'} size={24} aria-hidden="true" />
                                </div>
                                <p id="confirm-msg" className="text-body font-medium text-fg text-left mb-6">{confirmState.message}</p>
                                <div className="flex gap-2">
                                    <button autoFocus onClick={() => closeConfirm(false)}
                                            className="flex-1 tap bg-surface-2 text-fg-muted font-bold rounded-md text-label hover:bg-line transition-colors">
                                        취소
                                    </button>
                                    <button onClick={() => closeConfirm(true)}
                                            className={`flex-1 tap font-bold rounded-md text-label text-white transition-colors ${confirmState.danger ? 'bg-danger hover:opacity-90' : 'bg-primary hover:bg-primary-hover'}`}>
                                        {confirmState.confirmLabel}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Auth Modal (비밀번호 힌트 제거) */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4 text-center">
                            <div className="bg-surface w-full max-w-sm rounded-lg p-10 shadow-2xl animate-in zoom-in duration-200 text-center">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><Icon name="lock" size={24} className="text-primary" /> PM 관리자 인증</h2>
                                    <button onClick={() => setShowAdminLogin(false)} className="tap-icon text-fg-subtle hover:text-fg-muted" aria-label="닫기"><Icon name="close" size={24}  aria-hidden="true"/></button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (adminPasswordInput.trim() === ADMIN_PASSWORD) { 
                                        setIsAdminMode(true); 
                                        setShowAdminLogin(false); 
                                        setAdminPasswordInput(""); 
                                        setActiveTab("home"); 
                                    }
                                    else toast("관리자 비밀번호가 일치하지 않습니다.", "error");
                                }} className="space-y-4 text-center">
                                    <p className="text-caption text-fg-muted font-bold mb-4">관리자 전용 비밀번호를 입력하세요.</p>
                                    <input type="password" autoFocus className="w-full p-4 bg-surface-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500 text-center text-xl tracking-widest" placeholder="비밀번호 입력" value={adminPasswordInput} onChange={e => setAdminPasswordInput(e.target.value)} />
                                    <button className="w-full bg-slate-900 text-white py-4 rounded-md font-bold hover:bg-slate-800 transition-colors text-center">로그인</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
