        // 범용 이미지 압축 헬퍼 함수
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // 해상도 유지 및 용량 최적화
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // ═══════════ 로고 전용 압축 ═══════════
        // compressImage는 JPEG로 고정되어 있어 PNG 투명 배경이 검게 뭉갠다.
        // 로고는 알파 채널을 반드시 보존해야 하므로 PNG로 내보낸다.
        const LOGO_MAX_BYTES = 200 * 1024;
        const compressLogo = (file, onDone, onError) => {
            const reader = new FileReader();
            reader.onerror = () => onError && onError("파일을 읽지 못했습니다.");
            reader.onload = (event) => {
                const img = new Image();
                img.onerror = () => onError && onError("이미지 형식을 인식하지 못했습니다.");
                img.onload = () => {
                    const MAX = 400;
                    let w = img.width, h = img.height;
                    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
                    if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    // 배경을 칠하지 않음 → 투명 영역 그대로 유지
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const out = canvas.toDataURL('image/png');
                    // base64는 원본 대비 약 4/3 크기
                    const bytes = Math.round(out.length * 3 / 4);
                    if (bytes > LOGO_MAX_BYTES) {
                        onError && onError(`로고 용량이 ${Math.round(bytes/1024)}KB로 너무 큽니다. 200KB 이하 이미지를 사용해주세요.`);
                        return;
                    }
                    onDone(out, bytes);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // ═══════════ 포인트 컬러 파생 ═══════════
        // 관리자가 어떤 색을 넣어도 버튼 글씨가 읽히도록 대비를 계산해 결정한다.
        const hexToRgb = (hex) => {
            const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((hex || "").trim());
            return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : null;
        };
        const rgbToHsl = ({r,g,b}) => {
            r/=255; g/=255; b/=255;
            const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
            let h=0; const l=(max+min)/2;
            const s = d===0 ? 0 : d/(1-Math.abs(2*l-1));
            if (d!==0) {
                if (max===r) h=((g-b)/d)%6;
                else if (max===g) h=(b-r)/d+2;
                else h=(r-g)/d+4;
                h*=60; if (h<0) h+=360;
            }
            return { h, s, l };
        };
        const hslToHex = ({h,s,l}) => {
            s=Math.min(1,Math.max(0,s)); l=Math.min(1,Math.max(0,l));
            const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
            let [r,g,b] = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
            const to = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
            return `#${to(r)}${to(g)}${to(b)}`;
        };
        const relLuminance = ({r,g,b}) => {
            const f = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
            return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b);
        };
        const contrastRatio = (hexA, hexB) => {
            const a = hexToRgb(hexA), b = hexToRgb(hexB);
            if (!a || !b) return 0;
            const la = relLuminance(a), lb = relLuminance(b);
            return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
        };
        const DEFAULT_POINT = "#2563EB";
        // 포인트 컬러 하나에서 배경·표면·테두리·글자색까지 한 세트로 파생한다.
        // 배경은 같은 색이 아니라 같은 '계열'로만 아주 옅게 물들인다(채도를 크게 낮춤).
        const deriveTheme = (hex) => {
            const rgb = hexToRgb(hex);
            if (!rgb) return deriveTheme(DEFAULT_POINT);
            const hsl = rgbToHsl(rgb);
            const h = hsl.h;
            const s = hsl.s;

            const primary = hslToHex(hsl);
            const hover   = hslToHex({ ...hsl, l: Math.max(0.08, hsl.l - 0.08) });
            const soft    = hslToHex({ h, s: s * 0.35, l: 0.95 });

            // ── 세트 컬러: 같은 색조, 아주 낮은 채도 ──
            const bg       = hslToHex({ h, s: Math.min(s * 0.22, 0.16), l: 0.975 });
            const surface2 = hslToHex({ h, s: Math.min(s * 0.28, 0.20), l: 0.958 });
            const border   = hslToHex({ h, s: Math.min(s * 0.20, 0.14), l: 0.902 });
            // 본문 글자도 완전 중성 회색 대신 살짝 같은 계열로 (대비는 유지)
            const fg       = hslToHex({ h, s: Math.min(s * 0.30, 0.22), l: 0.17 });
            const fgMuted  = hslToHex({ h, s: Math.min(s * 0.22, 0.16), l: 0.36 });
            const fgSubtle = hslToHex({ h, s: Math.min(s * 0.18, 0.14), l: 0.48 });
            // 로그인/사업부 선택 화면의 짙은 배경
            const deep     = hslToHex({ h, s: Math.min(s * 0.55, 0.45), l: 0.12 });

            // 흰 글씨와 짙은 글씨 중 대비가 높은 쪽을 자동 선택
            const onWhite = contrastRatio(primary, "#FFFFFF");
            const onDark  = contrastRatio(primary, "#0F172A");
            const onPrimary = onWhite >= onDark ? "#FFFFFF" : "#0F172A";

            return {
                primary, hover, soft, onPrimary,
                bg, surface2, border, fg, fgMuted, fgSubtle, deep,
                contrast: Math.max(onWhite, onDark),
                bodyContrast: contrastRatio(fg, bg)
            };
        };

            };

            };

            const handleSaveContent = async (e) => {
                e.preventDefault();
                if (!window.FB) return;
                const { addDoc, updateDoc } = window.FB;
                
                let finalCategory = formState.category;
                if (!finalCategory) {
                    if (activeTab === 'materials') finalCategory = categoriesList.length > 0 ? categoriesList[0].name : "기타";
                    else if (activeTab === 'videos') finalCategory = videoCategoriesList.length > 0 ? videoCategoriesList[0].name : "기타";
                }
                
                const data = { ...formState, category: finalCategory, isVideo: activeTab === 'videos', timestamp: Date.now() };
                
                if (editingId) {
                    await updateDoc(docRef('messages', editingId), data);
                    toast("수정되었습니다.", "success");
                } else {
                    await addDoc(colRef('messages'), data);
                    toast("등록되었습니다.", "success");

                setEditingId(null);
                setFormState({ title: "", category: "", description: "", pdfUrl: "", pptUrl: "", youtubeUrl: "", thumbnail: "" });

                const list = messages.filter(m => m.category !== "제품 브로슈어" && (m.isVideo === isVidTab || (isVidTab ? m.youtubeUrl : !m.youtubeUrl)));
                const catMatch = selectedCategory === "전체" ? list : list.filter(m => m.category === selectedCategory);
                return catMatch.filter(m => m.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [messages, activeTab, searchQuery, selectedCategory]);

                } catch(e) { console.error(e); }
            };

                if (!(await askConfirm(`해당 설명회의 거래처 신청 내역 ${docIds.length}건을 삭제하시겠습니까? 되돌릴 수 없습니다.`))) return;
                try {
                    await Promise.all(docIds.map(id => window.FB.deleteDoc(docRef('requests_301', id))));
                } catch(e) { console.error(e); }
            };

            // 관리자용 301 신청 현황 그룹핑
            const grouped301RequestsAdmin = useMemo(() => {
                const groups = {};
                requests301.forEach(req => {
                    const key = `${req.title}_${req.dateString.slice(0, 11)}_${req.empId}`; 
                    if (!groups[key]) {
                        groups[key] = { ...req, count: 1, docIds: [req.id] };
                    } else {
                        groups[key].count += 1;
                        groups[key].docIds.push(req.id);
                        if (!req.completed) groups[key].completed = false; // 하나라도 대기중이면 전체 대기
                    }
                });
                return Object.values(groups).sort((a, b) => b.timestamp - a.timestamp);
            }, [requests301]);

            // 301 신청 현황 그룹핑 (같은 제목, 같은 날짜별로 묶음)
            const grouped301MyRequests = useMemo(() => {
                const myReqs = requests301.filter(r => r.empId === empId);
                const groups = {};
                myReqs.forEach(req => {
                    const key = `${req.title}_${req.dateString.slice(0, 11)}`;
                    if (!groups[key]) groups[key] = { ...req, count: 1 };
                    else {
                        groups[key].count += 1;
                        if(!req.completed) groups[key].completed = false; // 하나라도 대기중이면 전체 대기
                    }
                });
                return Object.values(groups);
            }, [requests301, empId]);

                sessionStorage.setItem('mr_app_id', d.dataAppId);
            };

            const clearDivision = () => {

            useEffect(() => {
                if (currentDivision && currentDivision.dataAppId !== activeAppId) {

                    sessionStorage.setItem('mr_app_id', currentDivision.dataAppId);
                }
            }, [currentDivision, activeAppId]);

                setBrandAuthOpen(false);

            const eyeDropperSupported = typeof window !== "undefined" && "EyeDropper" in window;
            const pickWithEyeDropper = async () => {
                if (!eyeDropperSupported) {
                    toast("이 브라우저는 스포이드를 지원하지 않습니다. 크롬이나 엣지에서 사용해주세요.", "error");
                    return;
                }
                try {
                    const result = await new window.EyeDropper().open();
                    if (result && result.sRGBHex) {
                        setBrandDraft(d => ({ ...d, pointColor: result.sRGBHex }));
                        toast(`색상 ${result.sRGBHex} 을(를) 가져왔습니다.`, "success");
                    }
                } catch (e) {
                    // 사용자가 Esc로 취소한 경우 — 조용히 넘어감
                }

            const brandLogoUpload = (e, apply) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = "";           // 같은 파일 재선택 가능하도록
                if (!file) return;
                compressLogo(file, (base64) => { apply(base64); toast("로고를 불러왔습니다. 저장을 눌러야 반영됩니다."); },
                                   (msg) => toast(msg, "error"));

                    `이 사업부에 등록된 자료·신청 데이터는 삭제되지 않고 그대로 남습니다. ` +

                setBrandDraft(s => ({ ...s, divisions: s.divisions.filter((_, i) => i !== idx) }));

                    ...brandDraft,
                    divisions: brandDraft.divisions.filter(d => (d.label || "").trim())

                if (!clean.divisions.length) { toast("사업부를 최소 1개는 남겨주세요.", "error"); return; }
                if (clean.divisions.some(d => !d.dataAppId)) { toast("사업부 데이터 공간 값이 비어 있습니다.", "error"); return; }
                setBrandSaving(true);
                try {
                    await window.FB.setDoc(brandRef(), clean, { merge: true });
                    setBrand(clean);

                    setBrandEditorOpen(false);
                } catch (e) {
                    console.error(e);
                    toast("저장 중 오류가 발생했습니다.", "error");
                } finally {
                    setBrandSaving(false);
                }
            };

            // ===== 화면 렌더링 =====

            // 브랜드 설정 화면 (로그인 전 첫페이지에서 진입)
            if (brandEditorOpen && brandDraft) {

                                                제거
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <p className="text-caption text-fg-muted mb-5">PNG 투명 배경 그대로 유지됩니다. 200KB 이하, 가로 400px로 자동 축소.</p>

                                <label htmlFor="bd-company" className="block text-label font-medium text-fg mb-2">회사명</label>

                                       style={{ minHeight: 'var(--input-h)' }} />

                                <label htmlFor="bd-title" className="block text-label font-medium text-fg mb-2">앱 이름</label>
                                <input id="bd-title" value={brandDraft.appTitle}

                                       style={{ minHeight: 'var(--input-h)' }} />

                                    {/* 스포이드 */}
                                    <button onClick={pickWithEyeDropper}
                                            aria-label="스포이드로 화면에서 색 선택"

                                            className={`w-14 h-14 shrink-0 rounded-md border border-line flex items-center justify-center transition-colors ${
                                                eyeDropperSupported ? 'bg-surface text-fg-muted hover:bg-primary-soft hover:text-primary' : 'bg-surface-2 text-fg-subtle'}`}>
                                        <Icon name="eyedropper" size={20} aria-hidden="true" />

                                                style={{ background: c, borderColor: brandDraft.pointColor.toLowerCase() === c.toLowerCase() ? 'var(--color-fg)' : 'transparent' }} />

                                      ['포인트', draftTheme.primary], ['진한 배경', draftTheme.deep]].map(([name, c]) => (

                                    <div className="rounded-md p-3 mb-3" style={{ background: '#FFFFFF', border: `1px solid ${draftTheme.border}` }}>

                                        {draftTheme.contrast >= 4.5 ? ' 읽기 좋습니다' : ' 기준(4.5:1) 미달, 더 진한 색을 권합니다'}
                                    </p>
                                    <p className={`text-caption font-bold flex items-center gap-2 ${draftTheme.bodyContrast >= 4.5 ? 'text-success' : 'text-danger'}`}>

                                                    <p className="text-xs font-bold text-slate-500 text-left">담당자 정보</p>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="사업부명" value={sympForm.division} onChange={e=>setSympForm({...sympForm, division: e.target.value})} required/>
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="팀명" value={sympForm.team} onChange={e=>setSympForm({...sympForm, team: e.target.value})} required/>
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="담당자명" value={sympForm.name} onChange={e=>setSympForm({...sympForm, name: e.target.value})} required/>
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="담당자 연락처" value={sympForm.phone} onChange={e=>setSympForm({...sympForm, phone: e.target.value})} required/>
                                                    </div>
                                                </div>

                                                <div className="bg-slate-50 p-4 rounded-2xl border space-y-3">
                                                    <p className="text-xs font-bold text-slate-500 text-left">거래처 및 모객 닥터 정보</p>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="거래처명" value={sympForm.accountName} onChange={e=>setSympForm({...sympForm, accountName: e.target.value})} required/>
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="거래처코드" value={sympForm.accountCode} onChange={e=>setSympForm({...sympForm, accountCode: e.target.value})} required/>
                                                        <select className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" value={sympForm.targetProduct} onChange={e=>setSympForm({...sympForm, targetProduct: e.target.value})}>
                                                            <option value="자누비아">자누비아</option>
                                                            <option value="엠파맥스">엠파맥스</option>
                                                            <option value="엑시글루">엑시글루</option>
                                                            <option value="듀비에">듀비에</option>
                                                        </select>
                                                        <input type="number" className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="타겟 처방금액(원)" value={sympForm.rxAmount} onChange={e=>setSympForm({...sympForm, rxAmount: e.target.value})} required/>
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="모객 닥터명" value={sympForm.doctorName} onChange={e=>setSympForm({...sympForm, doctorName: e.target.value})} required/>
                                                        <input className="w-full p-3 bg-white border rounded-xl text-xs font-bold text-center min-w-0" placeholder="닥터 연락처" value={sympForm.doctorPhone} onChange={e=>setSympForm({...sympForm, doctorPhone: e.target.value})} required/>
                                                    </div>
                                                    <textarea className="w-full p-4 bg-white border rounded-xl text-sm font-bold h-24 outline-none resize-none mt-2" placeholder="기타 요청 사항" value={sympForm.memo} onChange={e=>setSympForm({...sympForm, memo: e.target.value})} />
                                                </div>

                                                <button className="w-full bg-green-600 text-white py-5 rounded-xl font-black text-sm flex items-center justify-center gap-2 shadow-lg"><Icon name="save" size={18}/> 모객 등록하기</button>
                                            </form>
                                        </div>
                                        
                                        <div className="bg-white rounded-[2rem] border p-4 shadow-sm mt-6">
                                            <h3 className="font-black text-sm text-slate-600 mb-3 text-center">나의 심포지엄 모객 현황</h3>
                                            <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                                                {sympRequests.filter(r => r.empId === empId).map(req => (
                                                    <div key={req.id} className="p-3 bg-slate-50 rounded-xl flex justify-between items-center border">
                                                        <div className="text-left">
                                                            <p className="text-xs font-bold text-slate-800 line-clamp-1">[{req.symposiumName}] {req.accountName}</p>
                                                            <p className="text-[10px] text-slate-500">{req.dateString.slice(0, 11)} 신청</p>
                                                        </div>
                                                        <span className={`text-[10px] font-black px-2 py-1 rounded-full whitespace-nowrap ${req.completed ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-600'}`}>
                                                            {req.completed ? '처리 완료' : '대기 중'}
                                                        </span>
                                                    </div>
                                                ))}
                                                {sympRequests.filter(r => r.empId === empId).length === 0 && <p className="text-xs text-slate-400 text-center py-4">모객 내역이 없습니다.</p>}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'inquiries' && (
                                    <div className="space-y-6">
                                        <div className="bg-white p-6 sm:p-8 rounded-[2.5rem] shadow-sm border border-slate-100 text-center">
                                            <div className="w-16 h-16 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner"><Icon name="messageSquare" size={32}/></div>
                                            <h2 className="text-xl font-black text-slate-800 mb-6">문의 및 건의사항</h2>
                                            <form onSubmit={submitInquiry} className="space-y-3">
                                                <div className="grid grid-cols-2 gap-3">
                                                    <input className="p-3 bg-slate-50 border-2 rounded-xl text-sm font-bold text-center outline-none focus:border-purple-500 min-w-0" placeholder="사업부명" value={inquiryForm.division} onChange={e=>setInquiryForm({...inquiryForm, division: e.target.value})} required/>
                                                    <input className="p-3 bg-slate-50 border-2 rounded-xl text-sm font-bold text-center outline-none focus:border-purple-500 min-w-0" placeholder="팀명" value={inquiryForm.team} onChange={e=>setInquiryForm({...inquiryForm, team: e.target.value})} required/>
                                                </div>
                                                <input className="w-full p-3 bg-slate-50 border-2 rounded-xl text-sm font-bold text-center outline-none focus:border-purple-500" placeholder="담당자명" value={inquiryForm.name} onChange={e=>setInquiryForm({...inquiryForm, name: e.target.value})} required/>
                                                <textarea className="w-full p-4 bg-slate-50 border-2 rounded-xl text-sm font-bold h-32 text-left resize-none outline-none focus:border-purple-500" placeholder="자유롭게 의견을 남겨주세요." value={inquiryForm.content} onChange={e=>setInquiryForm({...inquiryForm, content: e.target.value})} required/>
                                                <button className="w-full bg-purple-600 text-white py-4 rounded-xl font-black shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">의견 접수하기</button>
                                            </form>
                                        </div>
                                        
                                        <div className="bg-white rounded-[2rem] border p-4 shadow-sm mt-6">
                                            <h3 className="font-black text-sm text-slate-600 mb-3 text-center">나의 건의/문의 접수 현황</h3>
                                            <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                                                {inquiries.filter(i => i.empId === empId).map(inq => (
                                                    <div key={inq.id} className="p-3 bg-slate-50 rounded-xl flex justify-between items-center border">
                                                        <div className="text-left flex-1 min-w-0 pr-2">
                                                            <p className="text-xs font-bold text-slate-800 line-clamp-1">{inq.content}</p>
                                                            <p className="text-[10px] text-slate-500">{inq.dateString.slice(0, 11)} 접수</p>
                                                        </div>
                                                        <span className={`text-[10px] font-black px-2 py-1 rounded-full whitespace-nowrap shrink-0 ${inq.completed ? 'bg-purple-100 text-purple-700' : 'bg-slate-200 text-slate-600'}`}>
                                                            {inq.completed ? '답변 완료' : '대기 중'}
                                                        </span>
                                                    </div>
                                                ))}
                                                {inquiries.filter(i => i.empId === empId).length === 0 && <p className="text-xs text-slate-400 text-center py-4">문의 내역이 없습니다.</p>}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {(activeTab === 'materials' || activeTab === 'videos') && (
                                    <div className="space-y-4">
                                        <div className="relative group text-center">
                                            <Icon name="search" size={20} className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-blue-500 transition-colors text-center" />
                                            <input className="w-full pl-14 pr-6 py-5 bg-white rounded-[2rem] border-none shadow-sm outline-none text-sm font-black focus:ring-4 focus:ring-blue-50 transition-all text-center" placeholder="키워드 검색..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                                        </div>
                                        
                                        <div className="w-full overflow-x-auto custom-scrollbar py-2">
                                            <div className="flex gap-2 w-max px-1">
                                                {['전체', ...(activeTab === "materials" ? categoriesList : videoCategoriesList).map(c => c.name)].map(cat => (
                                                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`flex-shrink-0 whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-black transition-all text-center ${selectedCategory === cat ? "bg-slate-800 text-white shadow-lg scale-105" : "bg-white text-slate-500 border border-slate-100 hover:bg-slate-50"}`}>
                                                        {cat}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 gap-4 text-center mt-2">
                                            {filteredDisplay.map(item => (
                                                <div key={item.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-50 text-center active:scale-[0.98] transition-all group overflow-hidden">
                                                    {item.thumbnail && (
                                                        <div className="mb-4 -mx-6 -mt-6">
                                                            <img src={item.thumbnail} alt={item.title} className="w-full h-40 sm:h-48 object-cover" />
                                                        </div>
                                                    )}
                                                    
                                                    <span className="text-[9px] font-black px-2 py-1 bg-blue-50 text-blue-600 rounded-md uppercase mb-2 inline-block tracking-wider text-center">{item.category}</span>
                                                    <h3 className="text-lg font-black text-slate-800 mb-2 leading-tight group-hover:text-blue-600 transition-colors text-center">{item.title}</h3>
                                                    {item.description && <p className="text-[12px] text-slate-400 font-medium mb-5 line-clamp-2 leading-relaxed text-center">{item.description}</p>}
                                                    
                                                    <div className="flex gap-2 text-center mt-4">
                                                        {item.pdfUrl && <a href={item.pdfUrl} target="_blank" rel="noreferrer" onClick={() => logAction("PDF 열람", item.title)} className="flex-1 bg-red-50 text-red-600 py-4 rounded-2xl text-[10px] font-black border border-red-100 text-center flex items-center justify-center gap-1 hover:bg-red-100 transition-colors"><Icon name="download" size={14}/> PDF</a>}
                                                        {item.pptUrl && <a href={item.pptUrl} target="_blank" rel="noreferrer" onClick={() => logAction("PPT 열람", item.title)} className="flex-1 bg-orange-50 text-orange-600 py-4 rounded-2xl text-[10px] font-black border border-orange-100 text-center flex items-center justify-center gap-1 hover:bg-orange-100 transition-colors"><Icon name="download" size={14}/> PPT</a>}
                                                        {item.youtubeUrl && <a href={item.youtubeUrl} target="_blank" rel="noreferrer" onClick={() => logAction("영상 시청", item.title)} className="w-full bg-red-600 text-white py-4 rounded-2xl text-xs font-black shadow-lg shadow-red-100 flex items-center justify-center gap-2 text-center hover:bg-red-700 transition-colors"><Icon name="youtube" size={16}/> 영상 시청</a>}
                                                    </div>
                                                </div>
                                            ))}
                                            {filteredDisplay.length === 0 && <p className="py-20 text-center text-slate-300 font-bold italic text-sm">등록된 콘텐츠가 없습니다.</p>}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* ===== 토스트 (포커스를 뺏지 않음) ===== */}
                    <div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[80] w-full max-w-sm px-4 flex flex-col gap-2 pointer-events-none"
                         role="status" aria-live="polite" aria-atomic="false">
                        {toasts.map(t => (
                            <div key={t.id}
                                 className={`toast-enter pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-md shadow-modal text-label font-medium ${
                                     t.kind === 'error'   ? 'bg-danger text-white'   :
                                     t.kind === 'success' ? 'bg-success text-white'  :
                                                            'bg-slate-800 text-white'}`}>
                                <Icon name={t.kind === 'error' ? 'close' : t.kind === 'success' ? 'checkCircle' : 'helpCircle'}
                                      size={18} className="shrink-0 mt-0.5" aria-hidden="true" />
                                <span className="flex-1 text-left leading-relaxed">{t.message}</span>
                            </div>
                        ))}
                    </div>

                    {/* ===== 확인 모달 (window.confirm 대체) ===== */}
                    {confirmState && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
                             role="dialog" aria-modal="true" aria-labelledby="confirm-msg"
                             onClick={e => { if (e.target === e.currentTarget) closeConfirm(false); }}>
                            <div className="bg-surface w-full max-w-sm rounded-lg p-6 shadow-modal">
                                <div className={`w-12 h-12 rounded-md flex items-center justify-center mb-4 ${confirmState.danger ? 'bg-danger-soft text-danger' : 'bg-primary-soft text-primary'}`}>
                                    <Icon name={confirmState.danger ? 'trash' : 'helpCircle'} size={24} aria-hidden="true" />
                                </div>
                                <p id="confirm-msg" className="text-body font-medium text-fg text-left mb-6">{confirmState.message}</p>
                                <div className="flex gap-2">
                                    <button autoFocus onClick={() => closeConfirm(false)}
                                            className="flex-1 tap bg-surface-2 text-fg-muted font-bold rounded-md text-label hover:bg-line transition-colors">
                                        취소
                                    </button>
                                    <button onClick={() => closeConfirm(true)}
                                            className={`flex-1 tap font-bold rounded-md text-label text-white transition-colors ${confirmState.danger ? 'bg-danger hover:opacity-90' : 'bg-primary hover:bg-primary-hover'}`}>
                                        {confirmState.confirmLabel}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Auth Modal (비밀번호 힌트 제거) */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4 text-center">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-10 shadow-2xl animate-in zoom-in duration-200 text-center">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><Icon name="lock" size={24} className="text-blue-600" /> PM 관리자 인증</h2>
                                    <button onClick={() => setShowAdminLogin(false)} className="tap-icon text-slate-400 hover:text-slate-600" aria-label="닫기"><Icon name="close" size={24}  aria-hidden="true"/></button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (adminPasswordInput.trim() === ADMIN_PASSWORD) { 
                                        setIsAdminMode(true); 
                                        setShowAdminLogin(false); 
                                        setAdminPasswordInput(""); 
                                        setActiveTab("home"); 
                                    }
                                    else toast("관리자 비밀번호가 일치하지 않습니다.", "error");
                                }} className="space-y-4 text-center">
                                    <p className="text-xs text-slate-500 font-bold mb-4">관리자 전용 비밀번호를 입력하세요.</p>
                                    <input type="password" autoFocus className="w-full p-4 bg-slate-50 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 text-center text-xl tracking-widest" placeholder="비밀번호 입력" value={adminPasswordInput} onChange={e => setAdminPasswordInput(e.target.value)} />
                                    <button className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition-colors text-center">로그인</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
